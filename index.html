<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SERG — Social Epistemology Reading Group</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#F5F7F4; --surface:#FFFFFF; --ink:#1C2433; --muted:#566172; --line:#D6DCD6;
  --open:#2B7563; --open-bg:#E1EFE9; --pending:#8E630E; --pending-bg:#F5EBD3;
  --booked:#2B3D66; --booked-bg:#E3E8F3; --cancel:#868C96; --danger:#A33A2E;
  --focus:#3C6FD1;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131820; --surface:#1A2029; --ink:#E6E9EE; --muted:#9AA4B3; --line:#2D3541;
    --open:#6CC2AA; --open-bg:#19332D; --pending:#E0B45E; --pending-bg:#372D17;
    --booked:#AABDE9; --booked-bg:#222B41; --cancel:#7D8592; --danger:#E27D70; --focus:#86A9F0;
  }
}
:root[data-theme="dark"]{
  --paper:#131820; --surface:#1A2029; --ink:#E6E9EE; --muted:#9AA4B3; --line:#2D3541;
  --open:#6CC2AA; --open-bg:#19332D; --pending:#E0B45E; --pending-bg:#372D17;
  --booked:#AABDE9; --booked-bg:#222B41; --cancel:#7D8592; --danger:#E27D70; --focus:#86A9F0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
a{color:var(--booked)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Header */
header.top{padding:40px 0 8px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font:700 clamp(40px,7vw,64px)/1 var(--serif);letter-spacing:-.02em;margin:0}
.brand p{margin:0;font:400 18px/1.3 var(--serif);color:var(--muted)}
.about{max-width:62ch;color:var(--muted);margin:14px 0 0}
nav.tabs{display:flex;gap:4px;margin:28px 0 0;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--pending-bg);color:var(--pending);font-size:12px;font-weight:600;text-align:center}

/* Next meeting */
.next{margin:28px 0 8px;padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--booked);border-radius:4px;display:grid;gap:4px}
.next.open{border-left-color:var(--open)}
.next small{color:var(--muted);font-weight:500}
.next .when{font:600 24px/1.25 var(--serif)}
.next .what{font:400 19px/1.4 var(--serif)}
.next .what em{font-style:italic}

/* Controls */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.open{background:var(--open);border-color:var(--open);color:#fff}
.btn.small{padding:5px 10px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

/* Schedule */
.term{margin:34px 0 0}
.term h2{font:600 22px/1.2 var(--serif);margin:0 0 10px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:76px minmax(150px,210px) 1fr auto;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.row.past{opacity:.6}
.wk{font:700 40px/1 var(--serif);color:var(--ink);text-align:right;font-variant-numeric:lining-nums}
.wk span{display:block;font:500 12px/1.2 var(--sans);color:var(--muted);margin-bottom:2px}
.row.cancelled .wk{color:var(--cancel)}
.date strong{display:block;font-weight:600}
.date span{color:var(--muted);font-size:14px}
.content{min-width:0}
.content .title{font:400 18px/1.35 var(--serif);overflow-wrap:anywhere}
.content .who{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:4px;margin-bottom:4px}
.tag.open{background:var(--open-bg);color:var(--open)}
.tag.pending{background:var(--pending-bg);color:var(--pending)}
.tag.booked{background:var(--booked-bg);color:var(--booked)}
.tag.cancelled{background:transparent;color:var(--cancel);border:1px solid var(--line)}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;margin-top:20px}
.notice{margin:20px 0 0;padding:12px 16px;border-radius:6px;background:var(--booked-bg);color:var(--ink);font-size:15px}
.notice.warn{background:var(--pending-bg)}

/* Lists (mine / admin) */
section.block{margin:40px 0 0}
section.block h2{font:600 22px/1.2 var(--serif);margin:0 0 4px}
section.block > p.hint{color:var(--muted);margin:0 0 14px;font-size:15px}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.item .meta{color:var(--muted);font-size:14px}
.item .title{font:400 18px/1.35 var(--serif);overflow-wrap:anywhere}
.item .ctrl{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.item select{max-width:230px}
.list{border-top:1px solid var(--line)}
details.decided summary{cursor:pointer;color:var(--muted);margin-top:20px}

/* Dialog + forms */
dialog{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,20,.45)}
.dlg{padding:22px 24px 20px;overflow:auto;max-height:calc(100vh - 42px)}
.dlg h3{font:600 22px/1.25 var(--serif);margin:0 0 4px}
.dlg .sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.field{margin:0 0 16px}
.field label,.field .lbl{display:block;font-weight:600;margin-bottom:5px}
.field .help{display:block;color:var(--muted);font-size:14px;margin:-2px 0 6px;font-weight:400}
input[type=text],input[type=email],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
textarea{min-height:190px;resize:vertical;font-size:15px}
.radios{display:flex;gap:18px}
.radios label{font-weight:400;display:flex;align-items:center;gap:6px;cursor:pointer}
.kindpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.kindpick button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer}
.kindpick button strong{display:block;font:600 17px/1.2 var(--serif)}
.kindpick button span{color:var(--muted);font-size:13px}
.kindpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.foot .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--danger);font-size:14px;margin:0 0 10px}
.check{display:flex;gap:8px;align-items:center;font-weight:400!important}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);z-index:10}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{margin:60px 0 40px;color:var(--muted);font-size:14px}

@media (max-width:680px){
  .row{grid-template-columns:52px 1fr;gap:4px 14px;align-items:start}
  .wk{font-size:32px;grid-row:span 3}
  .content,.rowact{grid-column:2}
  .rowact{justify-content:flex-start;margin-top:6px}
  .item{grid-template-columns:1fr}
  .item .ctrl{justify-content:flex-start}
  .grid2,.kindpick{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>SERG</h1>
      <p>Social Epistemology Reading Group</p>
    </div>
    <p class="about" id="about"></p>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="main"><div class="empty">Loading the schedule…</div></main>
  <footer>
    <p>Give a talk: 30 minutes of presentation, 30 minutes of Q&amp;A, with pastries, bagels or other delicious surprises. Suggest a reading: a paper, a book chapter, a blog post, anything under the social epistemology banner.</p>
    <p id="authLine"></p>
  </footer>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =====================================================================
   SETUP: paste your Firebase web app config here (see README.md, step 2).
   These values are not secret; the database rules protect the data.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.appspot.com",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut,
  sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, getDoc, addDoc, updateDoc, setDoc, deleteDoc,
  writeBatch, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const S = {
  configured: !String(firebaseConfig.apiKey).startsWith('PASTE'),
  uid:null, email:null, isAnon:true, isAdmin:false, authFailed:false, setupError:false,
  sessions:[], requests:[], settings:{}, loaded:false,
  tab:'schedule', filter:'all', showPast:false
};
let app, auth, db;
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr = () => isoD(new Date());
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtLong = s => parseD(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const fmtShort = s => parseD(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const kindName = k => k==='talk' ? 'Talk' : 'Reading';
const sRef = id => doc(db,'sessions',id), rRef = id => doc(db,'requests',id);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),3400); }
function fail(e){ console.error(e); toast(e?.code==='permission-denied' ? 'You don’t have permission to do that.' : 'That didn’t save. Check your connection and try again.'); }

/* ---------- derived data ---------- */
const items = () => [...S.requests].sort((a,b)=>a.createdAt-b.createdAt);
const sortedSessions = () => [...S.sessions].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
function stateOf(s, list){
  if (s.cancelled) return {k:'cancelled'};
  if (s.booking) return {k:'booked', b:s.booking};
  const req = list.filter(i=>i.status==='pending' && i.sessionId===s.id);
  return req.length ? {k:'pending', req} : {k:'open'};
}
const allows = (s, kind) => !s.kind || s.kind==='any' || s.kind===kind;
const bookable = kind => { const t=todayStr(); return sortedSessions().filter(s=>s.date>=t && !s.cancelled && !s.booking && (!kind || allows(s,kind))); };
const sessionLabel = s => `Week ${s.week ?? '?'}, ${fmtShort(s.date)}${s.time? ', '+s.time:''}`;
const canBook = () => !!S.uid;

/* ---------- rendering ---------- */
function renderTabs(){
  const pend = S.isAdmin ? S.requests.filter(i=>i.status==='pending').length : 0;
  const mine = S.uid ? S.requests.filter(i=>i.uid===S.uid).length : 0;
  const tabs=[['schedule','Schedule']];
  if (mine) tabs.push(['mine','My requests']);
  if (S.isAdmin) tabs.push(['admin','Organisers']);
  $('#tabs').innerHTML = tabs.length>1 ? tabs.map(([id,l])=>`<button role="tab" data-tab="${id}" aria-selected="${S.tab===id}">${l}${id==='admin'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('') : '';
}
function renderAuthLine(){
  const el=$('#authLine'); if(!S.configured){ el.textContent=''; return; }
  if (!S.isAnon && S.email) el.innerHTML = `Signed in as ${esc(S.email)}${S.isAdmin?' (organiser)':''}. <button class="linkbtn" data-act="signout">Sign out</button>`;
  else el.innerHTML = `<button class="linkbtn" data-act="signin">Organiser sign-in</button>`;
}
function render(){
  $('#about').textContent = S.settings.about || '';
  renderTabs(); renderAuthLine();
  const m=$('#main');
  if (!S.configured){ m.innerHTML = `<div class="empty">This site isn’t connected to its database yet. Add the Firebase settings at the top of index.html (see README.md).</div>`; return; }
  if (S.setupError){ m.innerHTML = `<div class="empty">The database refused to share the schedule. Check that the rules from firestore.rules are published in the Firebase console.</div>`; return; }
  if (!S.loaded){ m.innerHTML = `<div class="empty">Loading the schedule…</div>`; return; }
  if (S.tab==='admin' && S.isAdmin) m.innerHTML = renderAdmin();
  else if (S.tab==='mine' && S.requests.some(i=>i.uid===S.uid)) m.innerHTML = renderMine();
  else { S.tab='schedule'; m.innerHTML = renderSchedule(); }
}
function accessNotice(){
  if (S.authFailed) return `<div class="notice warn">Booking is switched off right now. Organisers: enable Anonymous sign-in in the Firebase console.</div>`;
  if (!S.isAnon && S.email && !S.isAdmin) return `<div class="notice">You’re signed in as ${esc(S.email)}, which isn’t on the organiser list. You can still book like any attendee.</div>`;
  return '';
}
function renderNext(list){
  const t=todayStr(), s=sortedSessions().find(x=>x.date>=t && !x.cancelled);
  if (!s) return '';
  const st=stateOf(s,list), where=[s.time,s.room].filter(Boolean).map(esc).join(', ');
  let what;
  if (st.k==='booked'){ const b=st.b;
    what = b.kind==='talk' ? `<em>${esc(b.title)}</em>, a talk by ${esc(b.presenter||'TBC')}`
      : `Reading: <em>${esc(b.title)}</em>${b.author?` by ${esc(b.author)}`:''}${b.link?` (<a href="${esc(b.link)}" target="_blank" rel="noopener">link</a>)`:''}`;
  } else what = `Nothing booked yet.${canBook()?` <button class="btn open small" data-book="${s.id}">Book this date</button>`:''}`;
  return `<div class="next ${st.k==='booked'?'':'open'}"><small>Next meeting, week ${esc(s.week ?? '?')}</small><div class="when">${fmtLong(s.date)}${where?`, ${where}`:''}</div><div class="what">${what}</div></div>`;
}
function renderSchedule(){
  const list=items(), t=todayStr();
  let ss=sortedSessions(); const pastCount=ss.filter(s=>s.date<t).length;
  if (!S.showPast) ss=ss.filter(s=>s.date>=t);
  if (S.filter==='open') ss=ss.filter(s=>{const k=stateOf(s,list).k; return k==='open'||k==='pending';});
  let html = accessNotice() + renderNext(list) + `<div class="bar">
    <div class="seg" role="group" aria-label="Show"><button data-filter="all" aria-pressed="${S.filter==='all'}">All meetings</button><button data-filter="open" aria-pressed="${S.filter==='open'}">Free dates</button></div>
    <div class="actions">${canBook()?`<button class="btn ghost" data-newbook="talk">Offer a talk</button><button class="btn ghost" data-newbook="reading">Suggest a reading</button>`:''}</div></div>`;
  if (!S.sessions.length) return html + `<div class="empty">No meetings are scheduled yet.${S.isAdmin?`<br><br><button class="btn" data-act="term">Add a term of meetings</button>`:' Check back soon, or suggest a reading in the meantime.'}</div>`;
  if (!ss.length) html += `<div class="empty">${S.filter==='open'?'Every upcoming date is taken. You can still suggest a reading for a later term.':'No upcoming meetings.'}</div>`;
  const groups=new Map();
  for (const s of ss){ const k=s.term||'Meetings'; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(s); }
  for (const [term,g] of groups){
    html += `<div class="term"><h2>${esc(term)}</h2><div class="rows">`;
    for (const s of g){
      const st=stateOf(s,list), past=s.date<t; let content='', act='';
      if (st.k==='cancelled') content=`<span class="tag cancelled">No meeting</span>${s.notes?`<div class="who">${esc(s.notes)}</div>`:''}`;
      else if (st.k==='booked'){ const b=st.b;
        content=`<span class="tag booked">${kindName(b.kind)}</span><div class="title">${b.link?`<a href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.title)}</a>`:esc(b.title)}</div><div class="who">${b.kind==='talk'?esc(b.presenter||'Speaker TBC'):[b.author,b.presenter&&`introduced by ${b.presenter}`].filter(Boolean).map(esc).join(', ')||'Group reading'}</div>`;
      } else if (st.k==='pending'){ const r=st.req[0];
        content=`<span class="tag pending">Requested, awaiting confirmation</span><div class="title">${esc(r.title)}</div><div class="who">${st.req.length>1?`${st.req.length} requests for this date`:esc(r.name||'')}</div>`;
      } else content=`<span class="tag open">Free</span><div class="who">${s.kind==='talk'?'Open for a talk':s.kind==='reading'?'Open for a reading':'Open for a talk or a reading'}</div>`;
      if (!past && (st.k==='open'||st.k==='pending') && canBook()) act+=`<button class="btn ${st.k==='open'?'open':'ghost'} small" data-book="${s.id}">${st.k==='open'?'Book this date':'Request too'}</button>`;
      if (S.isAdmin){ if (st.k==='booked'&&!past) act+=`<button class="btn ghost small" data-announce="${s.id}">Announce</button>`; act+=`<button class="btn ghost small" data-edit="${s.id}">Edit</button>`; }
      html += `<div class="row ${st.k} ${past?'past':''}"><div class="wk"><span>Week</span>${esc(s.week ?? '–')}</div>
        <div class="date"><strong>${fmtShort(s.date)}</strong><span>${[s.time,s.room].filter(Boolean).map(esc).join(', ')}</span></div>
        <div class="content">${content}</div><div class="rowact">${act}</div></div>`;
    }
    html += `</div></div>`;
  }
  if (pastCount) html += `<p style="margin-top:18px"><button class="linkbtn" data-act="past">${S.showPast?'Hide past meetings':`Show ${pastCount} past meeting${pastCount>1?'s':''}`}</button></p>`;
  return html;
}
function statusText(it){
  if (it.status==='approved'){ const s=S.sessions.find(x=>x.id===it.assignedSession); return `<span class="tag booked">Confirmed</span> ${s?esc(sessionLabel(s)):''}`; }
  if (it.status==='declined') return `<span class="tag cancelled">Not scheduled</span>`;
  const s=S.sessions.find(x=>x.id===it.sessionId);
  return `<span class="tag pending">Awaiting confirmation</span> ${s?esc(sessionLabel(s)):'Any date'}`;
}
function renderMine(){
  const mine=items().filter(i=>i.uid===S.uid).reverse();
  return `<section class="block"><h2>My requests</h2><p class="hint">Requests sent from this browser. Organisers confirm each one; you can withdraw a request until it’s confirmed.</p><div class="list">` +
    mine.map(it=>`<div class="item"><div><div class="meta">${kindName(it.kind)}</div><div class="title">${esc(it.title)}</div><div class="meta">${statusText(it)}</div></div><div class="ctrl">${it.status==='pending'?`<button class="btn ghost small" data-withdraw="${it.id}">Withdraw</button>`:''}</div></div>`).join('') + `</div></section>`;
}
function renderAdmin(){
  const list=items(), pending=list.filter(i=>i.status==='pending'), decided=list.filter(i=>i.status!=='pending').reverse(), free=bookable();
  const opts = it => { const c=free.filter(s=>allows(s,it.kind)); const req=S.sessions.find(s=>s.id===it.sessionId); if(req&&!c.includes(req)) c.unshift(req);
    return `<option value="">Choose a date…</option>`+c.map(s=>`<option value="${s.id}" ${s.id===it.sessionId?'selected':''}>${esc(sessionLabel(s))}${s.booking?' (taken)':''}</option>`).join(''); };
  const detail = it => it.kind==='talk' ? `Talk by ${esc(it.name||'—')}`
    : `Suggested by ${esc(it.name||'anonymous')}. Author: ${esc(it.author||'—')}. Intro: ${it.intro==='yes'?'yes':'no'}. Lead discussion: ${it.lead==='yes'?'yes':'no'}${it.link?`. <a href="${esc(it.link)}" target="_blank" rel="noopener">Open link</a>`:''}`;
  const sent = it => new Date(it.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  let html = `<div class="bar" style="margin-top:28px"><div class="actions"><button class="btn" data-act="term">Add a term of meetings</button><button class="btn ghost" data-act="one">Add one meeting</button><button class="btn ghost" data-announce="">Send an announcement</button><button class="btn ghost" data-act="settings">Settings</button></div></div>`;
  html += `<section class="block"><h2>Waiting for a decision</h2><p class="hint">Confirming a request books it onto the date you choose and shows it on the schedule.</p>`;
  html += !pending.length ? `<div class="empty">No requests are waiting.</div>` : `<div class="list">` + pending.map(it=>`<div class="item"><div>
      <div class="meta">${kindName(it.kind)}, sent ${sent(it)}</div><div class="title">${esc(it.title)}</div><div class="meta">${detail(it)}</div></div>
      <div class="ctrl"><select aria-label="Date" data-pick="${it.id}">${opts(it)}</select>
      <button class="btn open small" data-approve="${it.id}">Confirm</button><button class="btn ghost small" data-decline="${it.id}">Decline</button>
      <button class="linkbtn" data-remove="${it.id}">Delete as spam</button></div></div>`).join('') + `</div>`;
  html += `</section>`;
  if (decided.length) html += `<details class="decided"><summary>${decided.length} decided request${decided.length>1?'s':''}</summary><div class="list" style="margin-top:10px">` +
    decided.map(it=>`<div class="item"><div><div class="meta">${kindName(it.kind)} from ${esc(it.name||'anonymous')}</div><div class="title">${esc(it.title)}</div><div class="meta">${statusText(it)}</div></div><div class="ctrl"><button class="btn ghost small" data-reopen="${it.id}">Move back to waiting</button><button class="linkbtn" data-remove="${it.id}">Delete</button></div></div>`).join('') + `</div></details>`;
  html += `<section class="block"><h2>Organisers</h2><p class="hint">To add or remove an organiser, add or delete their email address in the <b>admins</b> collection in the Firebase console (see README.md).</p></section>`;
  return html;
}

async function submitBooking(form){
  const kind=form.dataset.kind, err=$('#formErr'); err.hidden=true;
  const v=id=>($('#'+id)?.value||'').trim(), radio=n=>form.querySelector(`input[name="${n}"]:checked`)?.value||'';
  const data={kind, name:v('f_name'), title:v('f_title'), author:'', link:'', intro:'', lead:'', sessionId:v('f_date')||null};
  const miss=[];
  if (kind==='talk'){ if(!data.name) miss.push('your name'); if(!data.title) miss.push('a talk title (or TBC)'); if(!data.sessionId) miss.push('a date'); }
  else { data.author=v('f_author'); data.link=v('f_link'); data.intro=radio('f_intro'); data.lead=radio('f_lead');
    if(!data.title) miss.push('the title'); if(!data.author) miss.push('the author');
    if(!data.intro) miss.push('whether you’d give an introduction'); if(!data.lead) miss.push('whether you’d lead the discussion');
    if (data.link && !/^https?:\/\//i.test(data.link)) data.link='https://'+data.link; }
  if (miss.length){ err.textContent='Add '+miss.join(', ')+' to send this.'; err.hidden=false; return; }
  const btn=form.querySelector('[type=submit]'); btn.disabled=true;
  try{ await addDoc(collection(db,'requests'), {...data, uid:S.uid, status:'pending', createdAt:serverTimestamp()});
    closeDlg(); toast(kind==='talk'?'Talk request sent. An organiser will confirm it.':'Reading suggestion sent. Thank you!');
  }catch(e){ console.error(e); btn.disabled=false; err.textContent='That didn’t send. Check your connection and try again.'; err.hidden=false; }
}
async function withdraw(id){ if(!confirm('Withdraw this request?')) return; try{ await deleteDoc(rRef(id)); toast('Request withdrawn.'); }catch(e){ fail(e); } }

/* ---------- organiser actions (the database rules enforce these, not the page) ---------- */
const bookingFrom = it => ({requestId:it.id, kind:it.kind, title:it.title||'', author:it.author||'', link:it.link||'', presenter:it.name||'', intro:it.intro||'', lead:it.lead||''});
const reqExists = id => S.requests.some(r=>r.id===id);
function clearBookingsOf(b, id, exceptSid){ for (const o of S.sessions) if (o.id!==exceptSid && o.booking?.requestId===id) b.update(sRef(o.id),{booking:null}); }
async function approve(id, sid){
  const it=S.requests.find(r=>r.id===id); if(!it) return;
  if (!sid){ toast('Choose a date for this request first.'); return; }
  const s=S.sessions.find(x=>x.id===sid), prev=s.booking?.requestId;
  if (prev && prev!==id && !confirm(`${sessionLabel(s)} already has “${s.booking.title}”. Replace it? That booking goes back to waiting.`)) return;
  const b=writeBatch(db);
  if (prev && prev!==id && reqExists(prev)) b.update(rRef(prev),{status:'pending', assignedSession:null});
  clearBookingsOf(b, id, sid);
  b.update(sRef(sid),{booking:bookingFrom(it)});
  b.update(rRef(id),{status:'approved', assignedSession:sid});
  try{ await b.commit(); toast('Confirmed and added to the schedule.'); }catch(e){ fail(e); }
}
async function decline(id){ const b=writeBatch(db); clearBookingsOf(b,id,null); b.update(rRef(id),{status:'declined',assignedSession:null}); try{ await b.commit(); toast('Request declined.'); }catch(e){ fail(e); } }
async function reopen(id){ const b=writeBatch(db); clearBookingsOf(b,id,null); b.update(rRef(id),{status:'pending',assignedSession:null}); try{ await b.commit(); toast('Moved back to waiting.'); }catch(e){ fail(e); } }
async function removeReq(id){ if(!confirm('Delete this request permanently?')) return; const b=writeBatch(db); clearBookingsOf(b,id,null); b.delete(rRef(id)); try{ await b.commit(); toast('Request deleted.'); }catch(e){ fail(e); } }

async function saveSession(form){
  const v=id=>$('#'+id).value.trim(), id=form.dataset.id, err=$('#formErr');
  const data={week:v('s_week')===''?null:Number(v('s_week')), time:v('s_time'), room:v('s_room'), term:v('s_term'), kind:v('s_kind'), notes:v('s_notes'), cancelled:$('#s_cancel').checked};
  try{
    if (id) await updateDoc(sRef(id), data);
    else { const date=v('s_date'); if(!date){ err.textContent='Choose a date.'; err.hidden=false; return; }
      let nid=date; if (S.sessions.find(s=>s.id===nid)) nid=date+'-'+Math.random().toString(36).slice(2,5);
      await setDoc(sRef(nid), {...data, date, booking:null}); }
    closeDlg(); toast(id?'Meeting updated.':'Meeting added.');
  }catch(e){ fail(e); }
}
async function unbook(id){
  const s=S.sessions.find(x=>x.id===id); if(!s?.booking) return;
  if(!confirm('Remove this booking? The request goes back to waiting.')) return;
  const b=writeBatch(db); b.update(sRef(id),{booking:null});
  if (reqExists(s.booking.requestId)) b.update(rRef(s.booking.requestId),{status:'pending',assignedSession:null});
  try{ await b.commit(); closeDlg(); toast('Booking removed.'); }catch(e){ fail(e); }
}
async function deleteSession(id){
  const s=S.sessions.find(x=>x.id===id);
  if(!confirm(s?.booking?'This meeting has a booking. Delete it anyway? The request goes back to waiting.':'Delete this meeting?')) return;
  const b=writeBatch(db);
  if (s?.booking && reqExists(s.booking.requestId)) b.update(rRef(s.booking.requestId),{status:'pending',assignedSession:null});
  for (const r of S.requests) if (r.status==='pending' && r.sessionId===id) b.update(rRef(r.id),{sessionId:null});
  b.delete(sRef(id));
  try{ await b.commit(); closeDlg(); toast('Meeting deleted.'); }catch(e){ fail(e); }
}

async function saveTerm(form){
  const v=id=>$('#'+id).value.trim(), err=$('#formErr');
  const first=v('t_first'), w1=Number(v('t_w1')||1), wn=Number(v('t_wn')||w1), term=v('t_term');
  if(!term||!first){ err.textContent='Add a term name and the first date.'; err.hidden=false; return; }
  if(wn<w1||wn-w1>40){ err.textContent='The last week number must come after the first, within 40 weeks.'; err.hidden=false; return; }
  const skip=new Set(v('t_skip').split(/[ ,;]+/).filter(Boolean).map(Number));
  const b=writeBatch(db); let n=0;
  for(let w=w1; w<=wn; w++){ if(skip.has(w)) continue;
    const d=parseD(first); d.setDate(d.getDate()+(w-w1)*7); const id=isoD(d);
    if(S.sessions.find(s=>s.id===id)) continue;
    b.set(sRef(id),{date:id, week:w, term, time:v('t_time'), room:v('t_room'), kind:v('t_kind'), notes:'', cancelled:false, booking:null}); n++; }
  if (!S.settings.defaultTime && !S.settings.defaultRoom) b.set(doc(db,'config','settings'), {...S.settings, defaultTime:v('t_time'), defaultRoom:v('t_room')});
  try{ await b.commit(); closeDlg(); toast(`${n} meeting${n===1?'':'s'} added.`); }catch(e){ fail(e); }
}

/* ---------- announcement ---------- */
function buildAnnouncement(s){
  const b=s.booking, st=S.settings, when=`${fmtLong(s.date)}${s.time?', '+s.time:''}`;
  let subject, lead;
  if (b.kind==='talk'){
    subject=`SERG week ${s.week ?? ''}: “${b.title}” by ${b.presenter||'TBC'} (${fmtShort(s.date)})`;
    lead=`At this week’s Social Epistemology Reading Group, ${b.presenter||'our speaker'} will present “${b.title}”.\n\nThe format is a 30-minute talk followed by 30 minutes of Q&A, with pastries, bagels or other delicious surprises.`;
  } else {
    subject=`SERG week ${s.week ?? ''}: reading “${b.title}” (${fmtShort(s.date)})`;
    const roles=[b.intro==='yes'&&'give a short introduction', b.lead==='yes'&&'lead the discussion'].filter(Boolean);
    lead=`This week at the Social Epistemology Reading Group we’ll read “${b.title}”${b.author?` by ${b.author}`:''}.${b.link?`\n\nYou can find it here: ${b.link}`:''}${b.presenter&&roles.length?`\n\n${b.presenter} will ${roles.join(' and ')}.`:''}`;
  }
  const link=st.siteLink||location.origin+location.pathname;
  return {subject, body:`Hi all,\n\n${lead}\n\nWhen: ${when}\nWhere: ${s.room||'TBC'}\n\nSee the full schedule, book a slot to present, or suggest a reading: ${link}\n\nBest,\n${st.signoff||'The SERG organisers'}`};
}
function openAnnounce(id){
  const t=todayStr(), list=sortedSessions().filter(s=>s.date>=t && s.booking && !s.cancelled);
  if(!list.length){ openDlg(`<h3>Send an announcement</h3><p class="sub">There are no confirmed upcoming meetings to announce yet.</p><div class="foot"><div class="right"><button class="btn" data-close>Close</button></div></div>`); return; }
  const s=list.find(x=>x.id===id)||list[0], a=buildAnnouncement(s), st=S.settings;
  openDlg(`<div><h3>Send an announcement</h3><p class="sub">${st.mailingList?`To ${esc(st.mailingList)}.`:'Add the mailing list address in Settings to fill in the recipient.'} Edit anything before sending.</p>
    <div class="field"><label for="a_sess">Meeting</label><select id="a_sess">${list.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(sessionLabel(x))}: ${esc(x.booking.title)}</option>`).join('')}</select></div>
    <div class="field"><label for="a_subj">Subject</label><input id="a_subj" type="text" value="${esc(a.subject)}"></div>
    <div class="field"><label for="a_body">Message</label><textarea id="a_body">${esc(a.body)}</textarea></div>
    <p class="sub" style="margin-top:-6px">“Open in Outlook” starts a draft in your computer’s default mail app. If a different app opens, copy the subject and message into a new Outlook email instead.</p>
    <div class="foot"><div class="right" style="flex-wrap:wrap"><button type="button" class="btn ghost" data-copy="a_subj">Copy subject</button><button type="button" class="btn ghost" data-copy="a_body">Copy message</button><a class="btn" id="a_mailto">Open in Outlook</a></div></div></div>`);
  updateMailto();
}
function updateMailto(){ const a=$('#a_mailto'); if(!a) return;
  a.href=`mailto:${encodeURIComponent(S.settings.mailingList||'')}?subject=${encodeURIComponent($('#a_subj').value)}&body=${encodeURIComponent($('#a_body').value.replace(/\n/g,'\r\n'))}`; }

    <div class="foot"><div class="right"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn ghost" type="submit">Email me a link</button></div></div></form>`);
}
async function googleSignIn(){ try{ await signInWithPopup(auth, new GoogleAuthProvider()); closeDlg(); }catch(e){ console.error(e); const err=$('#formErr'); if(err){ err.textContent = e.code==='auth/unauthorized-domain' ? 'This web address isn’t on the authorised domains list in Firebase (see README step 7).' : 'Sign-in didn’t complete. Try again.'; err.hidden=false; } } }
async function emailLink(){
  const email=$('#e_mail').value.trim(), err=$('#formErr'); if(!email){ err.textContent='Enter your email address.'; err.hidden=false; return; }
  try{ await sendSignInLinkToEmail(auth, email, {url: location.origin+location.pathname, handleCodeInApp:true}); try{ localStorage.setItem('sergSignInEmail', email); }catch(_){}
    closeDlg(); toast(`Sign-in link sent to ${email}. Open it on this device.`);
  }catch(e){ console.error(e); err.textContent='The link couldn’t be sent. Check the address, and that email-link sign-in is enabled in Firebase.'; err.hidden=false; }
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('button,a'); if(!t) return; const d=t.dataset;
  if (d.tab){ S.tab=d.tab; render(); return; }
  if (d.filter){ S.filter=d.filter; render(); return; }
  if (d.act==='past'){ S.showPast=!S.showPast; render(); return; }
  if (d.act==='signin'){ openSignIn(); return; }
  if (d.act==='google'){ googleSignIn(); return; }
  if (d.act==='signout'){ signOut(auth); return; }
  if (d.book!==undefined){ openBooking(d.book); return; }
  if (d.newbook){ openBooking(null, d.newbook); return; }
  if (d.kind){ const keep=$('#f_name')?.value||''; openBooking($('#bookForm').dataset.session||null, d.kind); $('#f_name').value=keep; return; }
  if (d.close!==undefined){ closeDlg(); return; }
  if (d.withdraw){ withdraw(d.withdraw); return; }
  if (d.copy){ copyField(d.copy); return; }
  if (!S.isAdmin) return;
  if (d.approve){ approve(d.approve, $(`select[data-pick="${d.approve}"]`)?.value); return; }
  if (d.decline){ decline(d.decline); return; }
  if (d.reopen){ reopen(d.reopen); return; }
  if (d.remove){ removeReq(d.remove); return; }
  if (d.edit){ openSessionEditor(d.edit); return; }
  if (d.act==='one'){ openSessionEditor(null); return; }
  if (d.act==='term'){ openTerm(); return; }
  if (d.act==='settings'){ openSettings(); return; }
  if (d.announce!==undefined){ openAnnounce(d.announce); return; }
  if (d.unbook){ unbook(d.unbook); return; }
  if (d.delsess){ deleteSession(d.delsess); return; }
});
document.addEventListener('submit', e=>{ e.preventDefault(); const f=e.target;
  if (f.id==='bookForm') submitBooking(f); else if (f.id==='sessForm') saveSession(f); else if (f.id==='termForm') saveTerm(f);
  else if (f.id==='setForm') saveSettings(); else if (f.id==='signForm') emailLink(); });
document.addEventListener('input', e=>{ if(e.target.id==='a_subj'||e.target.id==='a_body') updateMailto(); });
document.addEventListener('change', e=>{ if(e.target.id==='a_sess') openAnnounce(e.target.value); });

/* ---------- start ---------- */
async function start(){
  render();
  if (!S.configured) return;
  app=initializeApp(firebaseConfig); auth=getAuth(app); db=getFirestore(app);

  if (isSignInWithEmailLink(auth, location.href)){
    let email=null; try{ email=localStorage.getItem('sergSignInEmail'); }catch(_){}
    if (!email) email=prompt('Confirm your email address to finish signing in');
    try{ if(email) await signInWithEmailLink(auth, email, location.href); try{ localStorage.removeItem('sergSignInEmail'); }catch(_){} }
    catch(e){ console.error(e); toast('That sign-in link has expired or was already used. Request a new one.'); }
    history.replaceState(null,'',location.pathname);
  }

  onAuthStateChanged(auth, async u=>{
    if (!u){ S.uid=null; S.isAdmin=false; S.email=null; S.isAnon=true; render();
      try{ await signInAnonymously(auth); S.authFailed=false; }catch(e){ console.error(e); S.authFailed=true; render(); } return; }
    S.uid=u.uid; S.email=u.email||null; S.isAnon=u.isAnonymous; S.isAdmin=false;
    if (u.email){ try{ S.isAdmin=(await getDoc(doc(db,'admins',u.email.toLowerCase()))).exists(); }catch(_){ S.isAdmin=false; } }
    if (!S.isAdmin && S.tab==='admin') S.tab='schedule';
    render();
  });

  const onErr = e => { console.error(e); if (e.code==='permission-denied'){ S.setupError=true; render(); } };
  onSnapshot(collection(db,'sessions'), snap=>{ S.sessions=snap.docs.map(d=>({id:d.id,...d.data()})); S.loaded=true; S.setupError=false; render(); }, onErr);
  onSnapshot(query(collection(db,'requests'), orderBy('createdAt','desc'), limit(500)), snap=>{
    S.requests=snap.docs.map(d=>{ const x=d.data({serverTimestamps:'estimate'}); return {id:d.id, ...x, createdAt:x.createdAt?.toMillis?.() ?? Date.now()}; }); render(); }, onErr);
  onSnapshot(doc(db,'config','settings'), d=>{ S.settings=d.exists()?d.data():{}; render(); }, onErr);
}
start();
</script>
