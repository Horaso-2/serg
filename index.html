<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SERG — Social Epistemology Reading Group</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<style>

:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#5C5C5C; --line:#DADADA;
  --open:#000000; --open-bg:transparent; --pending:#000000; --pending-bg:#EFEFEF;
  --booked:#000000; --booked-bg:#F4F4F4; --cancel:#8A8A8A; --danger:#000000;
  --focus:#000000; --soft:#9A9A9A;
  --serif:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --surface:#0D0D0D; --ink:#FFFFFF; --muted:#A8A8A8; --line:#333333;
    --open:#FFFFFF; --open-bg:transparent; --pending:#FFFFFF; --pending-bg:#222222;
    --booked:#FFFFFF; --booked-bg:#161616; --cancel:#777777; --danger:#FFFFFF; --focus:#FFFFFF; --soft:#666666;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --surface:#0D0D0D; --ink:#FFFFFF; --muted:#A8A8A8; --line:#333333;
  --open:#FFFFFF; --open-bg:transparent; --pending:#FFFFFF; --pending-bg:#222222;
  --booked:#FFFFFF; --booked-bg:#161616; --cancel:#777777; --danger:#FFFFFF; --focus:#FFFFFF; --soft:#666666;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
a{color:var(--ink)}
input[type=radio],input[type=checkbox]{accent-color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Header */
header.top{padding:40px 0 8px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font:700 clamp(40px,7vw,64px)/1 var(--serif);letter-spacing:-.035em;margin:0}
.brand p{margin:0;font:400 18px/1.3 var(--serif);color:var(--muted)}
.about{max-width:62ch;color:var(--muted);margin:14px 0 0}
nav.tabs{display:flex;gap:4px;margin:28px 0 0;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:0;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;text-align:center}

/* Next meeting */
.next{margin:28px 0 8px;padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--booked);border-radius:0;display:grid;gap:4px}
.next.open{border-left-color:var(--soft)}
.next small{color:var(--muted);font-weight:500}
.next .when{font:600 24px/1.25 var(--serif)}
.next .what{font:400 19px/1.4 var(--serif)}
.next .what em{font-style:italic}

/* Controls */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:0;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:hover:not(:disabled){opacity:.8}
.btn.open{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.small{padding:5px 10px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

/* Schedule */
.term{margin:34px 0 0}
.term h2{font:600 22px/1.2 var(--serif);margin:0 0 10px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:76px minmax(150px,210px) 1fr auto;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.row.past{opacity:.6}
.wk{font:700 40px/1 var(--serif);color:var(--ink);text-align:right;font-variant-numeric:lining-nums}
.wk span{display:block;font:500 12px/1.2 var(--sans);color:var(--muted);margin-bottom:2px}
.row.cancelled .wk{color:var(--cancel)}
.date strong{display:block;font-weight:600}
.date span{color:var(--muted);font-size:14px}
.content{min-width:0}
.content .title{font:400 18px/1.35 var(--serif);overflow-wrap:anywhere}
.content .who{color:var(--muted);font-size:14px}
.bookeditem+.bookeditem{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:0;margin-bottom:4px}
.tag.open{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.tag.pending{background:var(--pending-bg);color:var(--ink);border:1px dashed var(--ink)}
.tag.booked{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.tag.cancelled{background:transparent;color:var(--cancel);border:1px solid var(--line)}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:0;margin-top:20px}
.notice{margin:20px 0 0;padding:12px 16px;border-radius:0;background:var(--booked-bg);color:var(--ink);font-size:15px}
.notice.warn{background:var(--pending-bg)}

/* Lists (mine / admin) */
section.block{margin:40px 0 0}
section.block h2{font:600 22px/1.2 var(--serif);margin:0 0 4px}
section.block > p.hint{color:var(--muted);margin:0 0 14px;font-size:15px}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.item .meta{color:var(--muted);font-size:14px}
.item .title{font:400 18px/1.35 var(--serif);overflow-wrap:anywhere}
.item .ctrl{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.item select{max-width:230px}
.list{border-top:1px solid var(--line)}
details.decided summary{cursor:pointer;color:var(--muted);margin-top:20px}

/* Dialog + forms */
dialog{border:1px solid var(--line);border-radius:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,20,.45)}
.dlg{padding:22px 24px 20px;overflow:auto;max-height:calc(100vh - 42px)}
.dlg h3{font:600 22px/1.25 var(--serif);margin:0 0 4px}
.dlg .sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.field{margin:0 0 16px}
.field label,.field .lbl{display:block;font-weight:600;margin-bottom:5px}
.field .help{display:block;color:var(--muted);font-size:14px;margin:-2px 0 6px;font-weight:400}
input[type=file]{width:100%;padding:8px 0}
input[type=text],input[type=email],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:0;background:var(--paper)}
textarea{min-height:190px;resize:vertical;font-size:15px}
textarea.note{min-height:80px}
.radios{display:flex;gap:18px}
.radios label{font-weight:400;display:flex;align-items:center;gap:6px;cursor:pointer}
.kindpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:18px}
.kindpick button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:0;background:var(--paper);cursor:pointer}
.kindpick button strong{display:block;font:600 17px/1.2 var(--serif)}
.kindpick button span{color:var(--muted);font-size:13px}
.kindpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.foot .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--ink);font-weight:600;font-size:14px;margin:0 0 10px;padding-left:10px;border-left:3px solid var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-weight:400!important}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:0;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);z-index:10}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{margin:60px 0 40px;color:var(--muted);font-size:14px}

@media (max-width:680px){
  .row{grid-template-columns:52px 1fr;gap:4px 14px;align-items:start}
  .wk{font-size:32px;grid-row:span 3}
  .content,.rowact{grid-column:2}
  .rowact{justify-content:flex-start;margin-top:6px}
  .item{grid-template-columns:1fr}
  .item .ctrl{justify-content:flex-start}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>SERG</h1>
      <p>Social Epistemology Reading Group</p>
    </div>
    <p class="about" id="about"></p>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="main"><div class="empty">Loading the schedule…</div></main>
  <footer>
    <p>If in need of additional info, please contact Zoé at z.e.barret@lse.ac.uk or Mikhail at m.volkov@lse.ac.uk</p>
    <p id="authLine"></p>
  </footer>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =====================================================================
   SETUP: paste your Firebase web app config here (see README.md, step 2).
   These values are not secret; the database rules protect the data.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAVL_wDhl5Ip_7ZkPQ2KZM2fK19nQHk4NY",
  authDomain: "serg-lse.firebaseapp.com",
  projectId: "serg-lse",
  storageBucket: "serg-lse.firebasestorage.app",
  messagingSenderId: "238704402012",
  appId: "1:238704402012:web:b303594038e22dab109099",
  measurementId: "G-6BJZ32YNBK"
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, getDoc, addDoc, updateDoc, setDoc, deleteDoc,
  writeBatch, serverTimestamp, query, orderBy, limit, getDocs, Bytes } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const S = {
  configured: !String(firebaseConfig.apiKey).startsWith('PASTE'),
  uid:null, email:null, isAnon:true, isAdmin:false, authFailed:false, setupError:false,
  sessions:[], requests:[], settings:{}, loaded:false,
  tab:'schedule', filter:'all', showPast:false
};
let app, auth, db;
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr = () => isoD(new Date());
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtLong = s => parseD(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const fmtShort = s => parseD(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const KIND = {talk:'Talk', reading:'Paper reading', draft:'Draft reading'};
const kindName = k => KIND[k] || 'Reading';
const isReadingKind = k => k==='reading' || k==='draft';
const MAX_PDF = 8*1024*1024, CHUNK = 900000;
const sRef = id => doc(db,'sessions',id), rRef = id => doc(db,'requests',id);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),3400); }
function fail(e){ console.error(e); toast(e?.code==='permission-denied' ? 'You don’t have permission to do that.' : 'That didn’t save. Check your connection and try again.'); }

/* ---------- derived data ---------- */
const items = () => [...S.requests].sort((a,b)=>a.createdAt-b.createdAt);
const sortedSessions = () => [...S.sessions].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
function bookingsMapOf(s){
  const map=s?.bookings && typeof s.bookings==='object' ? {...s.bookings} : {};
  if (s?.booking?.requestId && !map[s.booking.requestId]) map[s.booking.requestId]=s.booking;
  return map;
}
function bookingsOf(s){ return Object.entries(bookingsMapOf(s)).filter(([,b])=>b).map(([rid,b])=>({requestId:rid, ...b})); }
function stateOf(s, list){
  if (s.cancelled) return {k:'cancelled'};
  const bookings=bookingsOf(s);
  const req = list.filter(i=>i.status==='pending' && i.sessionId===s.id);
  if (bookings.length) return {k:'booked', bookings, req};
  return req.length ? {k:'pending', req} : {k:'open'};
}
const allows = (s, kind) => !s.kind || s.kind==='any' || s.kind===kind || (s.kind==='reading' && isReadingKind(kind));
const fileLink = x => x?.fileId ? ` <button class="linkbtn" data-file="${esc(x.fileId)}" data-fname="${esc(x.fileName||'reading.pdf')}">Download PDF</button>` : '';
const requestable = kind => { const t=todayStr(); return sortedSessions().filter(s=>s.date>=t && !s.cancelled && (!kind || allows(s,kind))); };
const sessionLabel = s => `Week ${s.week ?? '?'}, ${fmtShort(s.date)}${s.time? ', '+s.time:''}`;
const canBook = () => !!S.uid;

/* ---------- rendering ---------- */
function renderTabs(){
  const pend = S.isAdmin ? S.requests.filter(i=>i.status==='pending').length : 0;
  const mine = S.uid ? S.requests.filter(i=>i.uid===S.uid).length : 0;
  const tabs=[['schedule','Schedule']];
  if (mine) tabs.push(['mine','My requests']);
  if (S.isAdmin) tabs.push(['admin','Organisers']);
  $('#tabs').innerHTML = tabs.length>1 ? tabs.map(([id,l])=>`<button role="tab" data-tab="${id}" aria-selected="${S.tab===id}">${l}${id==='admin'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('') : '';
}
function renderAuthLine(){
  const el=$('#authLine'); if(!S.configured){ el.textContent=''; return; }
  if (!S.isAnon && S.email) el.innerHTML = `Signed in as ${esc(S.email)}${S.isAdmin?' (organiser)':''}. <button class="linkbtn" data-act="signout">Sign out</button>`;
  else el.innerHTML = `<button class="linkbtn" data-act="signin">Organiser sign-in</button>`;
}
function render(){
  $('#about').textContent = S.settings.about || '';
  renderTabs(); renderAuthLine();
  const m=$('#main');
  if (!S.configured){ m.innerHTML = `<div class="empty">This site isn’t connected to its database yet. Add the Firebase settings at the top of index.html (see README.md).</div>`; return; }
  if (S.setupError){ m.innerHTML = `<div class="empty">The database refused to share the schedule. Check that the rules from firestore.rules are published in the Firebase console.</div>`; return; }
  if (!S.loaded){ m.innerHTML = `<div class="empty">Loading the schedule…</div>`; return; }
  if (S.tab==='admin' && S.isAdmin) m.innerHTML = renderAdmin();
  else if (S.tab==='mine' && S.requests.some(i=>i.uid===S.uid)) m.innerHTML = renderMine();
  else { S.tab='schedule'; m.innerHTML = renderSchedule(); }
}
function accessNotice(){
  if (S.authFailed) return `<div class="notice warn">Booking is switched off right now. Organisers: enable Anonymous sign-in in the Firebase console.</div>`;
  if (!S.isAnon && S.email && !S.isAdmin) return `<div class="notice">You’re signed in as ${esc(S.email)}, which isn’t on the organiser list. You can still book like any attendee.</div>`;
  return '';
}
function renderNext(list){
  const t=todayStr(), s=sortedSessions().find(x=>x.date>=t && !x.cancelled);
  if (!s) return '';
  const st=stateOf(s,list), where=[s.time,s.room].filter(Boolean).map(esc).join(', ');
  const item = b => b.kind==='talk' ? `<em>${esc(b.title)}</em>, a talk by ${esc(b.presenter||'TBC')}`
    : b.kind==='draft' ? `Draft reading: <em>${esc(b.title)}</em> by ${esc(b.presenter||'TBC')}.${fileLink(b)}`
    : `Reading: <em>${esc(b.title)}</em>${b.author?` by ${esc(b.author)}`:''}${b.link?` (<a href="${esc(b.link)}" target="_blank" rel="noopener">link</a>)`:''}.${fileLink(b)}`;
  const extra = b => `${b.notes?` <div class="who">${esc(b.notes)}</div>`:''}${b.zoom?` <div class="who">Zoom: <a href="${esc(b.zoom)}" target="_blank" rel="noopener">${esc(b.zoom)}</a></div>`:''}`;
  let what;
  if (st.k==='booked'){ what = st.bookings.map(b=>item(b)+extra(b)).join('<hr style="border:0;border-top:1px solid var(--line);margin:8px 0">'); }
  else what = `Nothing booked yet.${canBook()?` <button class="btn open small" data-book="${s.id}">Book this date</button>`:''}`;
  return `<div class="next ${st.k==='booked'?'':'open'}"><small>Next meeting, week ${esc(s.week ?? '?')}</small><div class="when">${fmtLong(s.date)}${where?`, ${where}`:''}</div><div class="what">${what}</div></div>`;
}
function renderSchedule(){
  const list=items(), t=todayStr();
  let ss=sortedSessions(); const pastCount=ss.filter(s=>s.date<t).length;
  if (!S.showPast) ss=ss.filter(s=>s.date>=t);
  if (S.filter==='open') ss=ss.filter(s=>{const k=stateOf(s,list).k; return k==='open'||k==='pending';});
  let html = accessNotice() + renderNext(list) + `<div class="bar">
    <div class="seg" role="group" aria-label="Show"><button data-filter="all" aria-pressed="${S.filter==='all'}">All meetings</button><button data-filter="open" aria-pressed="${S.filter==='open'}">Free dates</button></div>
    <div class="actions">${canBook()?`<button class="btn ghost" data-newbook="talk">Offer a talk</button><button class="btn ghost" data-newbook="reading">Suggest a reading</button>`:''}</div></div>`;
  if (!S.sessions.length) return html + `<div class="empty">No meetings are scheduled yet.${S.isAdmin?`<br><br><button class="btn" data-act="term">Add a term of meetings</button>`:' Check back soon, or suggest a reading in the meantime.'}</div>`;
  if (!ss.length) html += `<div class="empty">${S.filter==='open'?'Every upcoming date is taken. You can still suggest a reading for a later term.':'No upcoming meetings.'}</div>`;
  const groups=new Map();
  for (const s of ss){ const k=s.term||'Meetings'; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(s); }
  for (const [term,g] of groups){
    html += `<div class="term"><h2>${esc(term)}</h2><div class="rows">`;
    for (const s of g){
      const st=stateOf(s,list), past=s.date<t; let content='', act='';
      if (st.k==='cancelled') content=`<span class="tag cancelled">No meeting</span>${s.notes?`<div class="who">${esc(s.notes)}</div>`:''}`;
      else if (st.k==='booked'){
        content=st.bookings.map(b=>`<div class="bookeditem"><span class="tag booked">${kindName(b.kind)}</span><div class="title">${b.link?`<a href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.title)}</a>`:esc(b.title)}</div><div class="who">${b.kind==='talk'?esc(b.presenter||'Speaker TBC'):b.kind==='draft'?`Draft by ${esc(b.presenter||'TBC')}`:([b.author,b.presenter&&`introduced by ${b.presenter}`].filter(Boolean).map(esc).join(', ')||'Group reading')}${fileLink(b)}</div>${b.notes?`<div class="who">${esc(b.notes)}</div>`:''}${b.zoom?`<div class="who">Zoom: <a href="${esc(b.zoom)}" target="_blank" rel="noopener">${esc(b.zoom)}</a></div>`:''}</div>`).join('');
        if (st.req.length) content+=`<div class="who" style="margin-top:6px">${st.req.length} more request${st.req.length>1?'s':''} awaiting confirmation</div>`;
      } else if (st.k==='pending'){ const r=st.req[0];
        content=`<span class="tag pending">Requested, awaiting confirmation</span><div class="title">${esc(r.title)}</div><div class="who">${st.req.length>1?`${st.req.length} requests for this date`:esc(r.name||'')}</div>`;
      } else content=`<span class="tag open">Free</span><div class="who">${s.kind==='talk'?'Open for a talk':s.kind==='reading'?'Open for a paper or draft reading':'Open for a talk or a reading'}</div>`;
      if (!past && st.k!=='cancelled' && canBook()) act+=`<button class="btn ${st.k==='open'?'open':'ghost'} small" data-book="${s.id}">${st.k==='open'?'Book this date':'Request'}</button>`;
      if (S.isAdmin){
        if (st.k==='booked'&&!past) act+=`<button class="btn ghost small" data-announce="${s.id}">Announce</button>`;

/* ---------- PDF attachments (stored in the database in pieces of up to 900 KB) ---------- */
async function uploadPdf(file, progress){
  const buf=new Uint8Array(await file.arrayBuffer()), chunks=Math.ceil(buf.length/CHUNK);
  const meta=await addDoc(collection(db,'files'), {name:file.name.slice(0,200), size:buf.length, chunks, type:'application/pdf', uid:S.uid, createdAt:serverTimestamp()});
  for (let i=0;i<chunks;i++){
    await setDoc(doc(db,'files',meta.id,'chunks',String(i)), {data:Bytes.fromUint8Array(buf.subarray(i*CHUNK,(i+1)*CHUNK))});
    progress && progress(Math.round((i+1)/chunks*100));
  }
  return meta.id;
}
async function downloadPdf(fileId, name, btn){
  const label=btn?.textContent; if(btn){ btn.disabled=true; btn.textContent='Downloading…'; }
  try{
    const snap=await getDocs(collection(db,'files',fileId,'chunks'));
    const parts=snap.docs.sort((a,b)=>Number(a.id)-Number(b.id)).map(d=>d.data().data.toUint8Array());
    if(!parts.length) throw new Error('empty');
    const url=URL.createObjectURL(new Blob(parts,{type:'application/pdf'}));
    const a=document.createElement('a'); a.href=url; a.download=/\.pdf$/i.test(name)?name:name+'.pdf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ console.error(e); toast('The PDF couldn’t be downloaded. It may have been removed.'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=label; } }
}
async function deletePdf(fileId){
  const snap=await getDocs(collection(db,'files',fileId,'chunks'));
  for (const d of snap.docs) await deleteDoc(d.ref);
  await deleteDoc(doc(db,'files',fileId));
}

function clearBookingsOf(b, id, exceptSid){
  for (const o of S.sessions){
    if (o.id===exceptSid) continue;
    const mm=bookingsMapOf(o);
    if (id in mm){ delete mm[id]; b.update(sRef(o.id), {bookings:mm, booking:null}); }
  }

  const mm=bookingsMapOf(s); mm[id]=bookingFrom(it);
  const b=writeBatch(db);
  clearBookingsOf(b, id, sid);
  b.update(sRef(sid),{bookings:mm, booking:null});
  b.update(rRef(id),{status:'approved', assignedSession:sid});
  try{ await b.commit(); toast('Confirmed and added to the schedule.'); }catch(e){ fail(e); }

async function deleteSession(id){

  const bs=bookingsOf(s);
  if(!confirm(bs.length?'This meeting has bookings. Delete it anyway? Those requests go back to waiting.':'Delete this meeting?')) return;

  for (const x of bs){ if (reqExists(x.requestId)) b.update(rRef(x.requestId),{status:'pending',assignedSession:null}); }
  for (const r of S.requests){ if (r.status==='pending' && r.sessionId===id) b.update(rRef(r.id),{sessionId:null}); }

    <div class="field"><label for="t_term">Term name</label><input id="t_term" type="text" placeholder="Michaelmas Term 2026"></div>
    <div class="grid2"><div class="field"><label for="t_first">Date of the first meeting</label><input id="t_first" type="date"></div><div class="field"><label for="t_w1">Its week number</label><input id="t_w1" type="number" min="0" max="60" value="1"></div></div>
    <div class="grid2"><div class="field"><label for="t_wn">Last week number</label><input id="t_wn" type="number" min="0" max="60" value="10"></div><div class="field"><label for="t_skip">Weeks with no meeting</label><input id="t_skip" type="text" placeholder="6"></div></div>
    <div class="grid2"><div class="field"><label for="t_time">Time</label><input id="t_time" type="text" placeholder="13:00–14:00" value="${esc(st.defaultTime||'')}"></div><div class="field"><label for="t_room">Room</label><input id="t_room" type="text" value="${esc(st.defaultRoom||'')}"></div></div>
    <div class="field"><label for="t_kind">Open for</label><select id="t_kind"><option value="any">Talk or reading</option><option value="talk">Talks only</option><option value="reading">Readings only (paper or draft)</option></select></div>
    <p class="err" id="formErr" hidden></p><div class="foot"><div class="right"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Add meetings</button></div></div></form>`);
}
async function saveTerm(form){
  const v=id=>$('#'+id).value.trim(), err=$('#formErr');
  const first=v('t_first'), w1=Number(v('t_w1')||1), wn=Number(v('t_wn')||w1), term=v('t_term');
  if(!term||!first){ err.textContent='Add a term name and the first date.'; err.hidden=false; return; }
  if(wn<w1||wn-w1>40){ err.textContent='The last week number must come after the first, within 40 weeks.'; err.hidden=false; return; }
  const skip=new Set(v('t_skip').split(/[ ,;]+/).filter(Boolean).map(Number));
  const b=writeBatch(db); let n=0;
  for(let w=w1; w<=wn; w++){ if(skip.has(w)) continue;
    const d=parseD(first); d.setDate(d.getDate()+(w-w1)*7); const id=isoD(d);
    if(S.sessions.find(s=>s.id===id)) continue;
    b.set(sRef(id),{date:id, week:w, term, time:v('t_time'), room:v('t_room'), kind:v('t_kind'), notes:'', cancelled:false, bookings:{}}); n++; }
  if (!S.settings.defaultTime && !S.settings.defaultRoom) b.set(doc(db,'config','settings'), {...S.settings, defaultTime:v('t_time'), defaultRoom:v('t_room')});
  try{ await b.commit(); closeDlg(); toast(`${n} meeting${n===1?'':'s'} added.`); }catch(e){ fail(e); }
}
function openSettings(){
  const st=S.settings;
  openDlg(`<form id="setForm"><h3>Settings</h3><p class="sub">Used for announcements and new meetings.</p>
    <div class="field"><label for="c_list">Mailing list address</label><input id="c_list" type="email" placeholder="serg-list@lse.ac.uk" value="${esc(st.mailingList||'')}"></div>
    <div class="field"><label for="c_link">Link to this site</label><span class="help">Included in announcements.</span><input id="c_link" type="url" value="${esc(st.siteLink||location.origin+location.pathname)}"></div>
    <div class="grid2"><div class="field"><label for="c_time">Usual time</label><input id="c_time" type="text" value="${esc(st.defaultTime||'')}"></div><div class="field"><label for="c_room">Usual room</label><input id="c_room" type="text" value="${esc(st.defaultRoom||'')}"></div></div>
    <div class="field"><label for="c_about">Short introduction under the title</label><input id="c_about" type="text" value="${esc(st.about||'')}"></div>
    <div class="field"><label for="c_sign">Sign-off for announcements</label><input id="c_sign" type="text" placeholder="The SERG organisers" value="${esc(st.signoff||'')}"></div>
    <div class="foot"><div class="right"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save settings</button></div></div></form>`);
}
async function saveSettings(){
  const v=id=>$('#'+id).value.trim();
  try{ await setDoc(doc(db,'config','settings'),{mailingList:v('c_list'), siteLink:v('c_link'), defaultTime:v('c_time'), defaultRoom:v('c_room'), about:v('c_about'), signoff:v('c_sign')}); closeDlg(); toast('Settings saved.'); }catch(e){ fail(e); }
}

/* ---------- announcement ---------- */
function announceLine(b){
  let text;
  if (b.kind==='talk') text=`${b.presenter||'our speaker'} will present “${b.title}”. There will be pastries, bagels or other delicious surprises.`;
  else if (b.kind==='draft') text=`we’ll read and discuss a draft by ${b.presenter||'one of our members'}, “${b.title}”.${b.fileId?' You can download the draft from the schedule on the SERG site (link below).':''}`;
  else { const roles=[b.intro==='yes'&&'give a short introduction', b.lead==='yes'&&'lead the discussion'].filter(Boolean);
    text=`we’ll read “${b.title}”${b.author?` by ${b.author}`:''}.${b.link?` You can find it here: ${b.link}`:''}${b.fileId?' A PDF is available to download from the schedule on the SERG site (link below).':''}${b.presenter&&roles.length?` ${b.presenter} will ${roles.join(' and ')}.`:''}`; }
  return `${text}${b.notes?`\nNote: ${b.notes}`:''}${b.zoom?`\nZoom: ${b.zoom}`:''}`;
}
function buildAnnouncement(s){
  const bs=bookingsOf(s), st=S.settings, when=`${fmtLong(s.date)}${s.time?', '+s.time:''}`;
  const first=bs[0]||{kind:'reading', title:''};
  const more=bs.length>1?` and ${bs.length-1} more`:'';
  let subject;
  if (first.kind==='talk') subject=`SERG week ${s.week ?? ''}: “${first.title}” by ${first.presenter||'TBC'}${more} (${fmtShort(s.date)})`;
  else if (first.kind==='draft') subject=`SERG week ${s.week ?? ''}: draft reading, “${first.title}” by ${first.presenter||'TBC'}${more} (${fmtShort(s.date)})`;
  else subject=`SERG week ${s.week ?? ''}: reading “${first.title}”${more} (${fmtShort(s.date)})`;
  const lead = bs.length===1
    ? `This week at the Social Epistemology Reading Group ${announceLine(first)}`
    : `This week at the Social Epistemology Reading Group we have ${bs.length} sessions:\n\n` + bs.map(b=>`• ${announceLine(b)}`).join('\n\n');
  const link=st.siteLink||location.origin+location.pathname;
  return {subject, body:`Hi all,\n\n${lead}\n\nWhen: ${when}\nWhere: ${s.room||'TBC'}\n\nSee the full schedule, book a slot to present, or suggest a reading: ${link}\n\nBest,\n${st.signoff||'The SERG organisers'}`};
}
function openAnnounce(id){
  const t=todayStr(), list=sortedSessions().filter(s=>s.date>=t && bookingsOf(s).length && !s.cancelled);
  if(!list.length){ openDlg(`<h3>Send an announcement</h3><p class="sub">There are no confirmed upcoming meetings to announce yet.</p><div class="foot"><div class="right"><button class="btn" data-close>Close</button></div></div>`); return; }
  const s=list.find(x=>x.id===id)||list[0], a=buildAnnouncement(s), st=S.settings;
  const titleOf = x => { const bs=bookingsOf(x); return bs[0].title + (bs.length>1?` +${bs.length-1}`:''); };
  openDlg(`<div><h3>Send an announcement</h3><p class="sub">${st.mailingList?`To ${esc(st.mailingList)}.`:'Add the mailing list address in Settings to fill in the recipient.'} Edit anything before sending.</p>
    <div class="field"><label for="a_sess">Meeting</label><select id="a_sess">${list.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(sessionLabel(x))}: ${esc(titleOf(x))}</option>`).join('')}</select></div>
    <div class="field"><label for="a_subj">Subject</label><input id="a_subj" type="text" value="${esc(a.subject)}"></div>
    <div class="field"><label for="a_body">Message</label><textarea id="a_body">${esc(a.body)}</textarea></div>
    <p class="sub" style="margin-top:-6px">“Open in Outlook” starts a draft in your computer’s default mail app. If a different app opens, copy the subject and message into a new Outlook email instead.</p>
    <div class="foot"><div class="right" style="flex-wrap:wrap"><button type="button" class="btn ghost" data-copy="a_subj">Copy subject</button><button type="button" class="btn ghost" data-copy="a_body">Copy message</button><a class="btn" id="a_mailto">Open in Outlook</a></div></div></div>`);
  updateMailto();
}
function updateMailto(){ const a=$('#a_mailto'); if(!a) return;
  a.href=`mailto:${encodeURIComponent(S.settings.mailingList||'')}?subject=${encodeURIComponent($('#a_subj').value)}&body=${encodeURIComponent($('#a_body').value.replace(/\n/g,'\r\n'))}`; }
async function copyField(id){ const el=$('#'+id);
  try{ await navigator.clipboard.writeText(el.value); toast('Copied.'); }
  catch(_){ el.focus(); el.select(); try{ document.execCommand('copy'); toast('Copied.'); }catch(__){ toast('Selected. Press Ctrl+C (or Cmd+C) to copy.'); } } }

/* ---------- organiser sign-in ---------- */
function openSignIn(){
  openDlg(`<div><h3>Organiser sign-in</h3><p class="sub">Only for organisers. Attendees don’t need to sign in to book.</p>
    <p class="err" id="formErr" hidden></p>
    <div class="foot"><div class="right"><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn" data-act="google">Sign in with Google</button></div></div></div>`);
}
async function googleSignIn(){ try{ await signInWithPopup(auth, new GoogleAuthProvider()); closeDlg(); }catch(e){ console.error(e); const err=$('#formErr'); if(err){ err.textContent = e.code==='auth/unauthorized-domain' ? 'This web address isn’t on the authorised domains list in Firebase (see README step 7).' : 'Sign-in didn’t complete. Try again.'; err.hidden=false; } } }

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('button,a'); if(!t) return; const d=t.dataset;
  if (d.tab){ S.tab=d.tab; render(); return; }
  if (d.filter){ S.filter=d.filter; render(); return; }
  if (d.act==='past'){ S.showPast=!S.showPast; render(); return; }
  if (d.act==='signin'){ openSignIn(); return; }
  if (d.act==='google'){ googleSignIn(); return; }
  if (d.act==='signout'){ signOut(auth); return; }
  if (d.book!==undefined){ openBooking(d.book); return; }
  if (d.newbook){ openBooking(null, d.newbook); return; }
  if (d.kind){ const keep=$('#f_name')?.value||''; openBooking($('#bookForm').dataset.session||null, d.kind); $('#f_name').value=keep; return; }
  if (d.close!==undefined){ closeDlg(); return; }
  if (d.withdraw){ withdraw(d.withdraw); return; }
  if (d.copy){ copyField(d.copy); return; }
  if (d.file){ downloadPdf(d.file, d.fname||'reading.pdf', t); return; }
  if (!S.isAdmin) return;
  if (d.approve){ approve(d.approve, $(`select[data-pick="${d.approve}"]`)?.value); return; }
  if (d.decline){ decline(d.decline); return; }
  if (d.reopen){ reopen(d.reopen); return; }
  if (d.remove){ removeReq(d.remove); return; }
  if (d.edit){ openSessionEditor(d.edit); return; }
  if (d.editbooking){ openBookingEditor(d.editbooking, d.req); return; }
  if (d.act==='one'){ openSessionEditor(null); return; }
  if (d.act==='term'){ openTerm(); return; }
  if (d.act==='settings'){ openSettings(); return; }
  if (d.announce!==undefined){ openAnnounce(d.announce); return; }
  if (d.unbook){ unbook(d.unbook, d.req); return; }
  if (d.delsess){ deleteSession(d.delsess); return; }
});
document.addEventListener('submit', e=>{ e.preventDefault(); const f=e.target;
  if (f.id==='bookForm') submitBooking(f); else if (f.id==='sessForm') saveSession(f); else if (f.id==='termForm') saveTerm(f);
  else if (f.id==='setForm') saveSettings(); else if (f.id==='bookEditForm') saveBookingEditor(f); });
document.addEventListener('input', e=>{ if(e.target.id==='a_subj'||e.target.id==='a_body') updateMailto(); });
document.addEventListener('change', e=>{ if(e.target.id==='a_sess') openAnnounce(e.target.value); });

/* ---------- start ---------- */
async function start(){
  render();
  if (!S.configured) return;
  app=initializeApp(firebaseConfig); auth=getAuth(app); db=getFirestore(app);

  onAuthStateChanged(auth, async u=>{
    if (!u){ S.uid=null; S.isAdmin=false; S.email=null; S.isAnon=true; render();
      try{ await signInAnonymously(auth); S.authFailed=false; }catch(e){ console.error(e); S.authFailed=true; render(); } return; }
    S.uid=u.uid; S.email=u.email||null; S.isAnon=u.isAnonymous; S.isAdmin=false;
    if (u.email){ try{ S.isAdmin=(await getDoc(doc(db,'admins',u.email.toLowerCase()))).exists(); }catch(_){ S.isAdmin=false; } }
    if (!S.isAdmin && S.tab==='admin') S.tab='schedule';
    render();
  });

  const onErr = e => { console.error(e); if (e.code==='permission-denied'){ S.setupError=true; render(); } };
  onSnapshot(collection(db,'sessions'), snap=>{ S.sessions=snap.docs.map(d=>({id:d.id,...d.data()})); S.loaded=true; S.setupError=false; render(); }, onErr);
  onSnapshot(query(collection(db,'requests'), orderBy('createdAt','desc'), limit(500)), snap=>{
    S.requests=snap.docs.map(d=>{ const x=d.data({serverTimestamps:'estimate'}); return {id:d.id, ...x, createdAt:x.createdAt?.toMillis?.() ?? Date.now()}; }); render(); }, onErr);
  onSnapshot(doc(db,'config','settings'), d=>{ S.settings=d.exists()?d.data():{}; render(); }, onErr);
}
start();
</script>
